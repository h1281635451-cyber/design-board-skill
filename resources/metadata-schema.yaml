schema_version: "1.0"
required:
  id: "stable-kebab-case-id"
  category: "competition-rule | award-case | style-reference | sample-project"
  title: "resource title"
  source_url: "original source URL"
  source_tier: "official-current | official-other | school-repost | historical | third-party | user-provided"
  accessed_at: "YYYY-MM-DD"
  verification_status: "verified | partial | unverified"
  artifact_type: "notice | guide | template | official-showcase | original-submission | inspiration | project-file"
  competition: "canonical competition name or null"
  edition_year: "year or null"
  track: "track/category or null"
  author_owner: "author/owner or unknown"
  license_use: "license or permitted internal use; unknown blocks bundling"
  local_path: "relative path or null for link-only resource"
optional:
  group: "participant group"
  notes: "limitations and how the resource may be used"
